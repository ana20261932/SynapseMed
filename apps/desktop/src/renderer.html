<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynapseMed — Connecting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0ea5e9, #0891b2);
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #f8fafc; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #334155;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size: 13px; color: #64748b; margin-top: 28px; }
    .retry {
      margin-top: 24px;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: #0ea5e9;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
    .retry:hover { background: #0284c7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏥</div>
    <div class="spinner"></div>
    <h1>SynapseMed</h1>
    <p id="status">Connecting to SynapseMed…</p>
    <p class="hint" id="detail">If this persists, check your internet connection.</p>
    <button class="retry" id="retry" style="display:none;">Retry</button>
  </div>
  <script>
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const retry = document.getElementById('retry');
    let attempts = 0;

    function showRetry() {
      retry.style.display = 'inline-block';
      detail.textContent = 'Unable to connect. Check your internet and try again.';
    }

    retry.addEventListener('click', () => {
      retry.style.display = 'none';
      status.textContent = 'Reconnecting…';
      detail.textContent = 'If this persists, check your internet connection.';
      attempts = 0;
      attemptLoad();
    });

    async function attemptLoad() {
      attempts++;
      try {
        const res = await fetch('/', { method: 'HEAD', cache: 'no-store', signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          window.location.reload();
          return;
        }
      } catch (e) {
        // ignore
      }
      if (attempts < 6) {
        setTimeout(attemptLoad, 3000);
      } else {
        showRetry();
      }
    }

    attemptLoad();
  </script>
</body>
</html>
